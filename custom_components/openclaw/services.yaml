send_message:
  name: Send Message
  description: Send a text message to OpenClaw and get a response.
  fields:
    message:
      name: Message
      description: The message text to send to OpenClaw.
      required: true
      example: "What's the weather like today?"
      selector:
        text:
          multiline: true
    session_id:
      name: Session ID
      description: Optional conversation session ID. Messages with the same session ID share context.
      required: false
      example: "my-automation-session"
      selector:
        text:
    agent_id:
      name: Agent ID
      description: >
        Optional OpenClaw agent ID to route this message to. Overrides the
        agent ID configured in the integration options. Defaults to "main".
      required: false
      example: "main"
      selector:
        text:

clear_history:
  name: Clear History
  description: Clear the conversation history for a session.
  fields:
    session_id:
      name: Session ID
      description: Session ID to clear. If omitted, clears the default session.
      required: false
      selector:
        text:

invoke_tool:
  name: Invoke Tool
  description: Invoke a single OpenClaw Gateway tool via /tools/invoke.
  fields:
    tool:
      name: Tool
      description: Tool name to invoke.
      required: true
      example: "sessions_list"
      selector:
        text:
    action:
      name: Action
      description: Optional action string passed to the tool endpoint.
      required: false
      example: "json"
      selector:
        text:
    args:
      name: Args
      description: Tool-specific args object.
      required: false
      selector:
        object:
    session_key:
      name: Session Key
      description: Optional target OpenClaw session key.
      required: false
      example: "main"
      selector:
        text:
    dry_run:
      name: Dry Run
      description: Optional dry-run flag (reserved by gateway).
      required: false
      selector:
        boolean:
    message_channel:
      name: Message Channel
      description: Optional channel hint header (e.g. slack, telegram).
      required: false
      selector:
        text:
    account_id:
      name: Account ID
      description: Optional account hint header for multi-account routing.
      required: false
      selector:
        text:

analyze_images:
  name: Analyze Images
  description: >
    Analyze one or more local images with OpenClaw using the Gateway /v1/responses endpoint.
    Paths must be accessible to Home Assistant and should be small image files.
  fields:
    prompt:
      name: Prompt
      description: User instruction for the image analysis.
      required: true
      example: "Compare these CCTV snapshots and return compact JSON."
      selector:
        text:
          multiline: true
    image_paths:
      name: Image Paths
      description: Local Home Assistant image paths to read and send as base64 images (maximum 8 images, 10 MiB each).
      required: true
      example:
        - "/config/www/cctv/driveway_before.jpg"
        - "/config/www/cctv/driveway_after.jpg"
      selector:
        object:
    session_id:
      name: Session ID
      description: Optional analysis session ID used for OpenClaw routing/user context.
      required: false
      example: "cctv-driveway"
      selector:
        text:
    agent_id:
      name: Agent ID
      description: Optional OpenClaw agent ID to route this analysis to.
      required: false
      example: "main"
      selector:
        text:
    model:
      name: Model
      description: Optional explicit OpenResponses model. If omitted, the integration active model is used when configured.
      required: false
      selector:
        text:
    instructions:
      name: Instructions
      description: Optional OpenResponses instructions field.
      required: false
      selector:
        text:
          multiline: true
    source:
      name: Source
      description: Optional event metadata source. Defaults to automation.
      required: false
      example: "automation"
      selector:
        text:
